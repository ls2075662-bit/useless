<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>time</title>
  <link rel="icon" href="https://img.icons8.com/?size=100&id=JuKnxZpgDUZ7&format=png&color=000000">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #fff;
      color: #f8fafc;
    }

    .clock-card{
      text-align: center;
    }

    .clock-image {
      display: block;
      width: 115px;          /* ajuste o tamanho como quiser */
      height: auto;
      margin: 0 auto 1.1rem; /* centraliza e dá espaço embaixo */
      border-radius: 0px;    /* opcional: bordas arredondadas */
    }

    .day-of-week {
      font-size: 1.0rem;
      
      color: #000;
      
      letter-spacing: 0.05em;
      margin-bottom: 0.25rem;
    }

    .full-date {
      font-size: 1.0rem;
      color: #000;
      margin-bottom: 0.25rem;
      
    }

    .time-display {
      font-size: 1.0rem;
      color: #000;
      margin-bottom: 0.25rem;
      letter-spacing: 0.10em;
    }
  </style>
</head>
<body>

  <div class="clock-card">
    <img src="https://i.redd.it/l5zf03th3uhf1.gif" alt="Imagem" class="clock-image">
    <div id="day-of-week" class="day-of-week">---</div>
    <div id="full-date" class="full-date">--/--/----</div>
    <div id="time-display" class="time-display">00:00:00</div>
  </div>

  <script>
    function updateClock() {
      const now = new Date();

      // Dia da semana (ex: quarta-feira)
      const dayName = now.toLocaleDateString('pt-BR', { weekday: 'long' });

      // Data formatada (DD/MM/YYYY)
      const day = String(now.getDate()).padStart(2, '0');
      const month = String(now.getMonth() + 1).padStart(2, '0');
      const year = now.getFullYear();
      const dateString = `${day}/${month}/${year}`;

      // Hora, minutos e segundos (HH:MM:SS)
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const seconds = String(now.getSeconds()).padStart(2, '0');
      const timeString = `${hours}:${minutes}:${seconds}`;

      // Atualiza o HTML
      document.getElementById('day-of-week').textContent = dayName;
      document.getElementById('full-date').textContent = dateString;
      document.getElementById('time-display').textContent = timeString;
    }

    // Executa a função imediatamente ao carregar
    updateClock();

    // Atualiza a cada 1 segundo (1000ms)
    setInterval(updateClock, 1000);
  </script>

</body>
</html>
