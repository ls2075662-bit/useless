<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>time</title>
  <link rel="icon" href="https://img.icons8.com/?size=100&id=JuKnxZpgDUZ7&format=png&color=000000">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #fff;
      color: #f8fafc;
    }

    .clock-card{
      text-align: center;
    }

    .clock-image {
      display: block;
      width: 115px;          /* ajuste o tamanho como quiser */
      height: auto;
      margin: 0 auto 1.1rem; /* centraliza e dá espaço embaixo */
      border-radius: 0px;    /* opcional: bordas arredondadas */
    }

    .day-of-week {
      font-size: 1.0rem;
      
      color: #000;
      
      letter-spacing: 0.05em;
      margin-bottom: 0.25rem;
    }

    .full-date {
      font-size: 1.0rem;
      color: #000;
      margin-bottom: 0.25rem;
      
    }

    .time-display {
      font-size: 1.0rem;
      color: #000;
      margin-bottom: 0.25rem;
      letter-spacing: 0.10em;
    }
  </style>
</head>
<body>

  <div class="clock-card">
    <img src="https://i.pinimg.com/originals/b2/58/85/b258854e249c5d4673a5938b90b6bbf5.gif" alt="Imagem" class="clock-image">
    <div id="day-of-week" class="day-of-week">---</div>
    <div id="full-date" class="full-date">--/--/----</div>
    <div id="time-display" class="time-display">00:00:00</div>
  </div>

  <script>
    function updateClock() {
      const now = new Date();

      // Dia da semana (ex: quarta-feira)
      const dayName = now.toLocaleDateString('pt-BR', { weekday: 'long' });

      // Data formatada (DD/MM/YYYY)
      const day = String(now.getDate()).padStart(2, '0');
      const month = String(now.getMonth() + 1).padStart(2, '0');
      const year = now.getFullYear();
      const dateString = `${day}/${month}/${year}`;

      // Hora, minutos e segundos (HH:MM:SS)
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const seconds = String(now.getSeconds()).padStart(2, '0');
      const timeString = `${hours}:${minutes}:${seconds}`;

      // Atualiza textos
      document.getElementById('day-of-week').textContent = dayName;
      document.getElementById('full-date').textContent = dateString;
      document.getElementById('time-display').textContent = timeString;

          // ===== MUDA A IMAGEM A PARTIR DAS 19:00 =====
      const img = document.querySelector('.clock-image');
      const currentHour = now.getHours();
      const currentMinute = now.getMinutes();

      if (currentHour >= 0 && currentHour < 4) {
        // Imagem entre 00:00h e 03:59h
        img.src = "https://mir-s3-cdn-cf.behance.net/project_modules/1400/dece5f124024167.60fb03546918b.gif";
      } else if(currentHour === 16 && currentMinute < 30){
        // Imagem entre 16:00h e 16:29h
        img.src = "https://64.media.tumblr.com/d1a531b5e2360e705b38f208513ba98e/f90870c81fc18ced-b1/s1280x1920/63f1b83102373ffa703b8b42052d4bcaca42bac3.gif";
      } else if(currentHour === 16 && currentMinute >= 30){
        // Tarde (2ª parte): 16:30h às 16:59h
        img.src = "https://64.media.tumblr.com/3404c30786d69d915e3f11e1d2fa7fab/f90870c81fc18ced-52/s500x750/1fb792adef06196a0982e244d298ec1e784e7df3.gifv";
      }
      
        else if (currentHour === 17) {
        // Imagem entre 17:00h e 17:59h
        img.src = "https://64.media.tumblr.com/32a119c83f1489f8d19b0f115015a948/675ea272e1286b0d-83/s1280x1920/0fe4252090513b39fdda7f045fae1ec0f9be6a24.gif";
      } else if (currentHour >= 19) {
        // Imagem das 19:00h às 23:59h
        img.src = "https://i.pinimg.com/originals/e4/c3/9a/e4c39a73c1d9f9d32ca69f9ea0783c66.gif";
      } else {
        // Imagem padrão (das 04:00h às 16:59h e das 18:00h às 18:59h)
        img.src = "https://i.pinimg.com/originals/b2/58/85/b258854e249c5d4673a5938b90b6bbf5.gif";
      }
      // Atualiza o HTML
      document.getElementById('day-of-week').textContent = dayName;
      document.getElementById('full-date').textContent = dateString;
      document.getElementById('time-display').textContent = timeString;
    }

    // Executa a função imediatamente ao carregar
    updateClock();

    // Atualiza a cada 1 segundo (1000ms)
    setInterval(updateClock, 1000);
  </script>

</body>
</html>
