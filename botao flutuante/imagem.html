<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Caretaker</title>
<style>
  html, body { margin: 0; height: 100%; background: #fff; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  img { max-width: 90%; max-height: 90%; z-index: 1; }
  audio { display: none; }

  #iniciar-experiencia {
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(255, 255, 255, 0.9);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: sans-serif;
    font-size: 20px;
    color: #333;
    cursor: pointer;
    z-index: 9999;
  }
</style>
</head>
<body>

<div id="iniciar-experiencia">tuk</div>

<img src="https://i1.sndcdn.com/artworks-lKcR6XEEY23Ihhio-yK9ztA-t500x500.jpg" alt="The Caretaker">

<audio id="meuAudio" loop>
  <source src="jailson-2.mp3" type="audio/mpeg">
</audio>

<script>
  const telaInicial = document.getElementById('iniciar-experiencia');
  const audio = document.getElementById('meuAudio');


  telaInicial.addEventListener('click', () => {
    audio.play();
    telaInicial.style.display = 'none';
  });
</script>
</body>
</html>
