<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="icon.ico" type="image/x-icon">
    <title>pagina acessada</title>
    <link rel="stylesheet" href="style.css">
    <style>
        * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(to bottom right, #4a90e2, #007AFF);
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: white;
    }


    h1 {
      margin-bottom: 10px;
      font-size: 30px;
    }

    h3 {
      margin-bottom: 20px;
      font-size: 18px;
    }

    form {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    input[type="submit"] {
      padding: 10px 20px;
      background-color: #ffffff;
      color: #007AFF;
      font-weight: bold;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.3s ease;
      margin-bottom: 20px;
    }

    input[type="submit"]:hover {
      background-color: #e6e6e6;
    }

    img {
      max-width: 100%;
      height: auto;
      border-radius: 10px;
      margin-top: 10px;
    }
    </style>
</head>
<body>
    <h1 style="text-align: center;">BOAS VINDAS!</h1>
    <br>
    <br>
    <form action="inicio-acesse o site.html">
        <div class="button" style="text-align: center;">
        <p><input type="submit" value="página inicial"></p>
        <!--<button><a href="inicio-acesse o site.html">inicio</a></button>-->
        <br>
    </div>
    </form>
    <div>
      <img src="skeleton-dance.gif" alt="GIF" style="display: block; margin: 0 auto;">
    </div>
    <br>
    <br>
    <h3 style="text-align: center;">snake game &#x1F447;</h3>
    <form action="snakegame.html">
      <p><input type="submit" value="jogar"></p>
</body>
</html>
